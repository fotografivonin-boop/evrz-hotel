{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <div class="form-page">
    <p class="breadcrumbs"><a href="{% url 'room_list' %}">Главная</a> / {{ title }}</p>
    <div class="panel">
      <h1>{{ title }}</h1>
      <form method="post" class="validated-form">
        {% csrf_token %}
        <div class="error-list" role="alert">{{ form.non_field_errors }}</div>

        {% for field in form %}
          <div class="form-pole">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
          </div>
        {% endfor %}

        <button class="full" type="submit">Сохранить</button>
      </form>
    </div>
  </div>
{% endblock %}
